params:
  - id: admin_username
    type: string
    name: Admin username
    description: "Username of the first administrator."
    default_value: "admin"
    optional: false
  - id: admin_password
    type: secret
    name: Admin password
    description: "Password of the first administrator."
    default_value: "$random(len=20)"
    optional: false
  - id: admin_email
    type: string
    name: Admin email
    description: "Email address of the first administrator."
    default_value: "admin@localhost"
    optional: false
locales:
  zh:
    admin_username:
      name: 管理员用户名
      description: 第一个管理员的用户名。
    admin_password:
      name: 管理员密码
      description: 第一个管理员的密码，默认随机生成，请记下来。
    admin_email:
      name: 管理员邮箱
      description: 第一个管理员的邮箱地址。
