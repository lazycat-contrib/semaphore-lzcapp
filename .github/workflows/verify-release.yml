name: Verify Semaphore UI Release on GitHub
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: false
        default: v2.19.17
permissions:
  contents: read
concurrency:
  group: semaphore-release-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="$(gh release view --json tagName --jq .tagName)"; fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download exact Release asset on runner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ASSET_NAME="community.lazycat.app.semaphore-${RELEASE_TAG}.lpk"
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
          gh release view "$RELEASE_TAG" --json tagName,assets > release-metadata.json
          gh release download "$RELEASE_TAG" --pattern "$ASSET_NAME" --dir verify-pkg

      - name: Verify package contents
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, tarfile, yaml

          tag = os.environ['RELEASE_TAG']
          name = os.environ['ASSET_NAME']
          pkg = __import__('pathlib').Path('verify-pkg') / name
          assert pkg.is_file(), pkg

          h = hashlib.sha256()
          with pkg.open('rb') as fh:
              for chunk in iter(lambda: fh.read(1 << 20), b''):
                  h.update(chunk)

          with tarfile.open(pkg, 'r:') as package:
              members = package.getnames()
              for required in ('manifest.yml', 'package.yml', 'content.tar', 'icon.png'):
                  assert required in members, (required, members)

              info = yaml.safe_load(package.extractfile('package.yml').read())
              assert info['package'] == 'community.lazycat.app.semaphore', info['package']
              assert info['name'] == 'Semaphore UI', info['name']
              assert info['version'] == tag.lstrip('v'), (info['version'], tag)
              assert info['license'] == 'MIT', info['license']
              assert info['min_os_version'] == '1.5.0', info['min_os_version']

              raw = package.extractfile('manifest.yml').read().decode()
              m = yaml.safe_load(raw)
              app = m['application']
              assert app['subdomain'] == 'semaphore', app['subdomain']
              ups = app['upstreams']
              assert any(u['location'] == '/' and 'semaphore:3000' in (u.get('backend') or '')
                         for u in ups), ups

              svcs = m['services']
              assert set(svcs) == {'semaphore'}, set(svcs)
              svc = svcs['semaphore']
              assert 'semaphoreui/semaphore' in svc['image'], svc['image']
              # upstream tags carry a v prefix while package.yml does not
              assert svc['image'].endswith(':' + tag), svc['image']

              env = ' '.join(str(x) for x in svc['environment'])
              # the wrapper only runs `semaphore setup` when config.json is absent,
              # and takes the seeded admin from these three variables
              assert 'SEMAPHORE_ADMIN=' in env and '.U.admin_username' in env, env
              assert 'SEMAPHORE_ADMIN_PASSWORD=' in env and '.U.admin_password' in env, env
              assert 'SEMAPHORE_ADMIN_EMAIL=' in env, env
              # the wrapper defaults to mysql; sqlite keeps this single-container
              assert 'SEMAPHORE_DB_DIALECT=sqlite' in env, env
              assert 'mysql' not in env.lower(), 'mysql dialect would need a second container'
              assert 'SEMAPHORE_WEB_ROOT=https://' in env, env
              assert 'SEMAPHORE_ACCESS_KEY_ENCRYPTION=' in env, env
              assert 'stable_secret' in env, 'access key encryption must not be a literal'

              binds = svc['binds']
              # config.json lives in /etc/semaphore; without it every restart re-runs setup
              assert any(b.endswith(':/var/lib/semaphore') for b in binds), binds
              assert any(b.endswith(':/etc/semaphore') for b in binds), binds
              for b in binds:
                  assert b.startswith('/lzcapp/var/'), b

              # no docker socket, no privileged mode: tasks stay inside this container
              assert 'docker.sock' not in raw, 'docker socket must not be mounted'
              assert 'privileged' not in raw, 'privileged mode must not be enabled'

              params = yaml.safe_load(package.extractfile('deploy_params.yml').read())
              by_id = {q['id']: q for q in params['params']}
              assert set(by_id) == {'admin_username', 'admin_password', 'admin_email'}, set(by_id)
              assert by_id['admin_password']['type'] == 'secret'
              assert 'random' in str(by_id['admin_password'].get('default_value', ''))
              refs = set(re.findall(r'\.U\.([A-Za-z0-9_]+)', raw))
              assert refs <= set(by_id), (refs, set(by_id))

              assert 'healthcheck' not in svc, svc
              assert 'lzc-file-chooser' not in raw
              assert 'usage' in m and str(m['usage']).strip(), 'usage section missing'
              usage_text = str(m['usage'])
              assert ('真机验证' in usage_text or '实机验证' in usage_text), 'usage must state no device test'

              with tarfile.open(fileobj=package.extractfile('content.tar')) as content:
                  cmembers = content.getnames()
                  lic = [n for n in cmembers if 'licenses/' in n]
                  assert lic, cmembers
                  main_lic = [n for n in lic if n.endswith('/LICENSE')]
                  target = main_lic[0] if main_lic else lic[0]
                  license_text = content.extractfile(target).read().decode()
                  flat = ' '.join(license_text.split())
                  assert 'MIT' in flat and 'Permission is hereby granted' in flat, flat[:150]

          result = {
              'verified': True,
              'tag': tag,
              'sha256': h.hexdigest(),
              'size': pkg.stat().st_size,
              'runtime_tested': False,
              'note': 'single container with SQLite; wrapper seeds the admin on first boot only',
          }
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('```json\n' + json.dumps(result, indent=2) + '\n```\n')
          PY
